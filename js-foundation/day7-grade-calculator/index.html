<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 7 - Grade Calculator</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="container">
        <h1>student grade calculator</h1>

        <div class="input-row">
            <input type="text" id="nameInput" placeholder="Student name...">
            <input type="number" id="marksInput" placeholder="marks(0 - 100)">
            <button onclick="addStudent()">Add</button>

        </div>

        <ul id="studentList"></ul>

        <div id="summary" class="summary"></div>


    </div>


    <script>

        // store all students 
        const students = [];

        function getGrade(marks) {
            if (marks >= 90) return "A+";
            else if (marks >= 80) return "A";
            else if (marks >= 70) return "B";
            else if (marks >= 60) return "C";
            else if (marks >= 50) return "D";
            else return "F"

        }


        function addStudent() {
            const nameInput = document.getElementById("nameInput");
            const marksInput = document.getElementById("marksInput");
            const list = document.getElementById("studentList");


            const name = nameInput.value.trim();
            const marks = parseInt(marksInput.value);

            if (name === "" || marksInput.value === "") {
                alert("please enter both name and mark")
                return
            }

            if ( isNaN(marks) || marks < 0 || marks > 100) {
                alert("Marks must be between 0 and 100");
                return
            }

            // add to array
            students.push({ name, marks })

            const grade = getGrade(marks);

            const status = marks >= 50 ? "Pass" : "fail";


            // create list item

            const li = document.createElement("li");
            li.className = status === "Pass" ? "pass" : "fail";

            li.innerHTML = `
              <span>${name}</span>
                <span>Marks: ${marks}</span>
                <span>Grade: ${grade}</span>
                <span class="status">${status}</span>
                <button onclick="deleteStudent(this)">Delete</button>

            `
            list.appendChild(li);

            // clear inputs
            nameInput.value = "";
            marksInput.value = "";

            // update summary
            updateSummary();
        }

        function deleteStudent(button) {
            const li = button.parentElement;
            const index = Array.from(li.parentElement.children).indexOf(li);
            students.splice(index, 1);
            li.remove();
            updateSummary();
        }

        function updateSummary() {
            const summary = document.getElementById("summary");

            if (students.length === 0) {
                summary.innerHTML = "";
                return;
            }

            // use array methods from Day 2
            const total = students.reduce((sum, s) => sum + s.marks, 0);
            const average = (total / students.length).toFixed(1);
            const passed = students.filter(s => s.marks >= 50).length;
            const failed = students.filter(s => s.marks < 50).length;
            const topStudent = students.reduce((top, s) => s.marks > top.marks ? s : top);

            summary.innerHTML = `
                <h3>Summary</h3>
                <p>Total Students: ${students.length}</p>
                <p>Average Marks: ${average}</p>
                <p>Passed: ${passed}</p>
                <p>Failed: ${failed}</p>
                <p>Top Student: ${topStudent.name} (${topStudent.marks})</p>
            `;
        }

        // enter key support
        document.addEventListener("keypress", function (e) {
            if (e.key === "Enter") addStudent();
        });





    </script>



</body>

</html>
