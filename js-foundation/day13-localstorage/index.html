<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 13 - LocalStorage</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>


    <div class="container">
        <h1>Todo list with LocalStorage</h1>
        <p class="subtitle">Items are saved evev after refresh</p>

        <div class="input-row">
            <input type="text" id="todoInput" placeholder="Enter a Task...">
            <button onclick="addTodo()">Add</button>

        </div>

        <ul id="todoList"></ul>

        <div class="footer">
            <span id="count">0 Tasks</span>
            <button onclick="clearAll()" class="clear-btn">Clear All</button>

        </div>

    </div>


    <script>

        // Load todos from localStorage when page opens
        let todos = JSON.parse(localStorage.getItem("todos")) || [];

        // Show existing todos on page load
        renderTodos();

        function addTodo() {
            const input = document.getElementById("todoInput");
            const text = input.value.trim();

            if (text === "") {
                alert("Please enter a task");
                return;
            }

            // create todo object

            const todo = {
                id: Date.now(),
                text: text,
                completed: false
            };


            // add to array
            todos.push(todo);

            // save to localStorage
            saveToLocalStorage();

            // clear input
            input.value = "";

            // re-render
            renderTodos()
        }

        function deleteTodo(id) {
            // remove from array by id
            todos = todos.filter((todo) => todo.id !== id);

            // save updated array
            saveToLocalStorage();

            // re-render
            renderTodos();
        }

        function toggleComplete(id) {
            // find todo and flip complete value
            todos = todos.map((todo) => {
                if (todo.id === id) {
                    return { ...todo, completed: !todo.completed };
                }
                return todo;
            })

            saveToLocalStorage();
            renderTodos();
        }

        function clearAll() {
            todos = [];
            saveToLocalStorage();
            renderTodos();
        }

        function saveToLocalStorage() {
            localStorage.setItem("todos", JSON.stringify(todos));
        }

        function renderTodos() {
            const list = document.getElementById("todoList");
            const count = document.getElementById("count");

            count.textContent = `${todos.length} tasks`;

            if (todos.length === 0) {
                list.innerHTML = "<p class='empty'>No tasks yet. Add one above</p>";
                return;
            }

            list.innerHTML = todos.map((todo) => `
            <li class="${todo.completed ? 'completed' : ''}" >
                <span onclick="toggleComplete(${todo.id})">${todo.text}</span>
                <button onclick="deleteTodo(${todo.id})">Delete</button>

            </li>
            `)

        }

        // enter key support
        document.getElementById("todoInput").addEventListener("keypress", (e) => {
            if (e.key === "Enter") addTodo();
        });




    </script>

</body>

</html>
